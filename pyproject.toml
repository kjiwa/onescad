[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onescad"
version = "0.0.0"
description = "Bundle an OpenSCAD model into one customizer-ready file"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
onescad = "onescad.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-cov", "mypy", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/onescad"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["tests/corpus"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]
exclude = ["tests/corpus/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=onescad --cov-report=term-missing"
markers = ["oracle: compares against a real openscad run"]

[tool.coverage.report]
fail_under = 90
